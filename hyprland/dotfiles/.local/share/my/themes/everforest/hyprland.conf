$foreground        = rgb(D3C6AA)  # Warm sand — primary text
$foreground_trans  = rgba(D3C6AA55)  # Warm sand — primary text
$background        = rgb(2D353B)  # Forest bg0 — editor background
$background_trans  = rgba(2D353B55)  # Forest bg0 — editor background
$green             = rgb(A7C080)  # Green — strings, additions
$accent1           = rgb(7FBBB3)  # Blue — keywords, highlights
