$accent2           = rgb(83C092)  # Aqua — functions, types
$accent2_trans     = rgba(83C09255)  # Aqua — functions, types
$green_trans       = rgba(A7C08055)  # Green — strings, additions
$active_border     = rgb(7FBBB3)  # Blue — keywords, highlights
