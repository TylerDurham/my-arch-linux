# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$foreground        = rgb(BEBEBE)  # Light grey — primary text
$foreground_trans  = rgba(BEBEBE55)  # Light grey — primary text
$background        = rgb(121212)  # Matte black — editor background
$background_trans  = rgba(12121255)  # Matte black — editor background
$green             = rgb(F59E0B)  # Amber — strings, additions (no green in palette)
$accent1           = rgb(E68E0D)  # Amber — keywords, highlights
$accent1_trans     = rgba(E68E0D55)  # Amber — keywords, highlights
$accent2           = rgb(FFC107)  # Bright amber — functions, types
$accent2_trans     = rgba(FFC10755)  # Bright amber — functions, types
$green_trans       = rgba(F59E0B55)  # Amber — strings, additions (no green in palette)
$active_border     = rgb(E68E0D)  # Amber — keywords, highlights
