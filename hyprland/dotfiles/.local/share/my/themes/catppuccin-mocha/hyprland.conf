$foreground        = rgb(CDD6F4)  # Text — primary text
$foreground_trans  = rgba(CDD6F455)  # Text — primary text
$background        = rgb(1E1E2E)  # Base — editor background
$background_trans  = rgba(1E1E2E55)  # Base — editor background
$green             = rgb(A6E3A1)  # Green — strings, additions
$accent1           = rgb(CBA6F7)  # Mauve — keywords, highlights
$accent1_trans     = rgba(CBA6F755)  # Mauve — keywords, highlights
$accent2           = rgb(89B4FA)  # Blue — functions, types
$accent2_trans     = rgba(89B4FA55)  # Blue — functions, types
$green_trans       = rgba(A6E3A155)  # Green — strings, additions
$active_border     = rgb(A6E3A1)  # Green — strings, additions
