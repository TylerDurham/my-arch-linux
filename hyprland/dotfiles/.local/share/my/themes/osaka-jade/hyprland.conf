$foreground        = rgb(C1C497)  # Pale olive — primary text
$foreground_trans  = rgba(C1C49755)  # Pale olive — primary text
$background        = rgb(111C18)  # Deep jade — editor background
$background_trans  = rgba(111C1855)  # Deep jade — editor background
$green             = rgb(63B07A)  # Green — strings, additions
$accent1           = rgb(509475)  # Jade — keywords, highlights
$accent1_trans     = rgba(50947555)  # Jade — keywords, highlights
$accent2           = rgb(2DD5B7)  # Teal — functions, types
$accent2_trans     = rgba(2DD5B755)  # Teal — functions, types
$green_trans       = rgba(63B07A55)  # Green — strings, additions
$active_border     = rgb(509475)  # Jade — keywords, highlights
